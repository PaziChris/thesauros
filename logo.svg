<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c9"/>
      <stop offset=".45" stop-color="#f0c066"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset=".4" stop-color="#4fd6ff"/>
      <stop offset="1" stop-color="#4fd6ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- äußerer HUD-Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#4fd6ff" stroke-opacity=".35" stroke-width=".8"/>
  <g stroke="#4fd6ff" stroke-opacity=".7" stroke-width="1.4" stroke-linecap="round">
    <line x1="50" y1="2.5" x2="50" y2="7"/><line x1="50" y1="93" x2="50" y2="97.5"/>
    <line x1="2.5" y1="50" x2="7" y2="50"/><line x1="93" y1="50" x2="97.5" y2="50"/>
  </g>
  <!-- segmentierter Goldring -->
  <circle cx="50" cy="50" r="39" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-dasharray="49.3 12" stroke-dashoffset="24.6" stroke-linecap="round"/>
  <!-- Theta -->
  <ellipse cx="50" cy="50" rx="17" ry="25" fill="none" stroke="url(#g)" stroke-width="4.6"/>
  <rect x="35" y="47.6" width="30" height="4.8" rx="2.4" fill="url(#g)"/>
  <!-- Kern -->
  <circle cx="50" cy="50" r="7" fill="url(#core)"/>
  <rect x="47.2" y="47.2" width="5.6" height="5.6" transform="rotate(45 50 50)" fill="#e9fbff"/>
</svg>
