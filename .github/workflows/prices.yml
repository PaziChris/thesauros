name: Gold- und Silberpreise aktualisieren
on:
  schedule:
    - cron: "17 21 * * *"   # täglich ca. 22:17 Wiener Zeit
  workflow_dispatch:
  push:
    paths: ["scripts/update_prices.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/update_prices.py
      - name: Änderungen speichern
        run: |
          git config user.name "thesauros-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Preisverlauf aktualisiert" && git push)
